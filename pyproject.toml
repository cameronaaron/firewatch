[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firewatch"
version = "2.0.0"
description = "Real-time wildfire monitoring and evacuation alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Cameron Aaron", email = "cameronthescientist@pm.me" },
]

dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "httpx>=0.28.0",
    "geopy>=2.5.0",
    "shapely>=2.1.0",
    "polars>=1.44.2",
    "numpy>=2.4.0",
    "scikit-learn>=1.9.1",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0",
]

[project.optional-dependencies]
bakeoff = [
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
]

dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/firewatch"
Documentation = "https://firewatch.readthedocs.io"
Repository = "https://github.com/yourusername/firewatch.git"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares dependencies as Depends()/Query() defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Verbatim KML fixtures inside triple-quoted strings; wrapping changes the data.
"tests/test_core_services_coverage.py" = ["E501"]
"tests/test_service_branch_coverage.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
